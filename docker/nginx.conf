server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # La config runtime ne doit jamais être mise en cache
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Assets Vite (noms hashés) : cache long
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fallback SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
